<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#102A43;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#167D9A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="256" height="256" rx="56" fill="url(#gradient)" />
  
  <!-- Outer ring accent -->
  <rect width="256" height="256" rx="56" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.15" />
  
  <!-- Bicycle/TukTok icon -->
  <g transform="translate(128, 128)">
    <!-- Left wheel circle -->
    <circle cx="-45" cy="25" r="35" fill="none" stroke="#ffffff" stroke-width="6"/>
    <circle cx="-45" cy="25" r="28" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
    
    <!-- Right wheel circle -->
    <circle cx="45" cy="25" r="35" fill="none" stroke="#ffffff" stroke-width="6"/>
    <circle cx="45" cy="25" r="28" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
    
    <!-- Frame - seat tube -->
    <line x1="0" y1="-30" x2="-45" y2="25" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Frame - down tube -->
    <line x1="0" y1="-30" x2="45" y2="25" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Frame - chain stay -->
    <line x1="-45" y1="25" x2="45" y2="25" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    
    <!-- Seat post -->
    <line x1="0" y1="-30" x2="5" y2="-45" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Seat -->
    <ellipse cx="5" cy="-50" rx="12" ry="6" fill="#ffffff"/>
    
    <!-- Handlebar post -->
    <line x1="0" y1="-30" x2="-8" y2="-55" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Handlebars -->
    <path d="M -20 -55 Q -8 -60 5 -55" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Pedal crank -->
    <circle cx="0" cy="5" r="8" fill="#ffffff" opacity="0.8"/>
  </g>
  
  <!-- Optional: subtle inner border for depth -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.08" />
</svg>
